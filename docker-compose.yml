services:
  db:
    build: "./TP2/nouvelle source/postgres"
    container_name: tp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  eonet:
    build: ./TP1/worker
    container_name: tp-eonet-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EONET_STATUS: ${EONET_STATUS}
      EONET_DAYS: ${EONET_DAYS}
      EONET_LIMIT: ${EONET_LIMIT}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS}

  usgs:
    build: "./TP2/nouvelle source/worker_usgs"
    container_name: tp-usgs-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USGS_MIN_MAGNITUDE: ${USGS_MIN_MAGNITUDE}
      USGS_DAYS: ${USGS_DAYS}
      USGS_LIMIT: ${USGS_LIMIT}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS}

  pgadmin:
    image: dpage/pgadmin4
    container_name: tp-pgadmin
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"

volumes:
  pgdata:

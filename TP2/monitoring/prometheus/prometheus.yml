global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: pipeline
    static_configs:
      - targets: ["pipeline-exporter:9105"]

  - job_name: docker-stats
    static_configs:
      - targets: ["docker-stats-exporter:9106"]
